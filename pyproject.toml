# Configuración del build system
[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "makeovermonday"
version = "0.1.0"
description = "Repositorio de retos semanales de MakeoverMonday y utilidades de soporte."
authors = ["JuanFeDS"]
readme = "README.md"
packages = [
    { include = "cli" },
    { include = "src" },
]

[tool.poetry.dependencies]
python = "^3.10"
asttokens = "2.4.1"
attrs = "24.2.0"
charset-normalizer = ">=3.4.4"
colorama = "0.4.6"
comm = "0.2.2"
debugpy = "1.8.7"
decorator = "5.1.1"
et-xmlfile = "1.1.0"
executing = "2.1.0"
fastjsonschema = "2.20.0"
fastparquet = ">=2025.12.0"
ipykernel = "6.29.5"
ipython = "8.28.0"
jedi = "0.19.1"
jsonschema = "4.23.0"
jsonschema-specifications = "2024.10.1"
jupyter-client = "8.6.3"
jupyter-core = "5.7.2"
matplotlib-inline = "0.1.7"
nbformat = "5.10.4"
nest-asyncio = "1.6.0"
numpy = "2.1.2"
openpyxl = "3.1.5"
packaging = "24.1"
pandas = "2.2.3"
parso = "0.8.4"
pydantic = "2.8.2"
platformdirs = "4.3.6"
plotly = "5.24.1"
prompt-toolkit = "3.0.48"
psutil = "6.0.0"
pure-eval = "0.2.3"
pyarrow = ">=23.0.1"
pygments = "2.18.0"
python-dateutil = "2.9.0.post0"
pytz = "2024.2"
pywin32 = "308"
pyzmq = "26.2.0"
referencing = "0.35.1"
rpds-py = "0.20.0"
six = "1.16.0"
squarify = ">=0.4.4"
stack-data = "0.6.3"
tenacity = "9.0.0"
tornado = "6.4.1"
traitlets = "5.14.3"
tzdata = "2024.2"
wcwidth = "0.2.13"
matplotlib = "^3.10.8"
seaborn = "^0.13.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
pytest-cov = "5.0.0"

[tool.pytest.ini_options]
addopts = "-vv --cov=cli --cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = [
    "tests",
]
python_files = "test_*.py"
